# Ten sam plik działa dla strony podglądu (wszyscy klienci) i dla strony klienta.
# Strona klienta: w ustawieniach Netlify dodaj zmienną środowiskową KLIENT=<nazwa-folderu>.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
