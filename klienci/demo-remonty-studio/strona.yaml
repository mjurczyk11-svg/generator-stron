faq:
  lista:
    - pytanie:
        pl: Ile kosztuje łazienka pod klucz?
      odpowiedz:
        pl: Zwykle od 35 000 do 70 000 zł z materiałami, zależnie od wielkości i wybranych materiałów. Projekt jest w cenie wykonania.
    - pytanie:
        pl: Ile trwa remont łazienki?
      odpowiedz:
        pl: 3–6 tygodni prac na miejscu. Projekt przygotowujemy wcześniej, w ciągu 2–3 tygodni.
    - pytanie:
        pl: Czy mogę zamówić sam projekt?
      odpowiedz:
        pl: Tak. Koszt projektu odliczamy, jeśli zdecydujesz się na wykonanie.
    - pytanie:
        pl: Czy trzeba się wyprowadzić?
      odpowiedz:
        pl: Nie, jeśli w mieszkaniu jest druga toaleta albo możliwość korzystania z innej.
formularz:
