faq:
  lista:
    - pytanie:
        pl: Czy mogę przyjść bez skierowania?
      odpowiedz:
        pl: Tak. Wystarczy umówić wizytę telefonicznie albo przez internet.
    - pytanie:
        pl: Czy robicie tomografię dla pacjentów z innych gabinetów?
      odpowiedz:
        pl: Tak, wykonujemy tomografię i zdjęcia RTG na zlecenie innych lekarzy. Wynik dostajesz na płycie lub mailem.
    - pytanie:
        pl: Ile trwa leczenie ortodontyczne?
      odpowiedz:
        pl: Zwykle od 12 do 24 miesięcy. Dokładny czas podajemy po konsultacji i analizie zdjęć.
    - pytanie:
        pl: Czy jest parking?
      odpowiedz:
        pl: Tak, bezpłatny parking podziemny dla pacjentów, wjazd od ul. Dąbrowskiego.
