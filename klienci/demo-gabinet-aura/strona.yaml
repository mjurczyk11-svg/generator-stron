faq:
  lista:
    - pytanie:
        pl: Czy przyjmujecie dzieci?
      odpowiedz:
        pl: Tak, od 3. roku życia. Pierwsza wizyta dziecka jest wizytą adaptacyjną, bez leczenia.
    - pytanie:
        pl: Czy leczenie jest bolesne?
      odpowiedz:
        pl: Zabiegi wykonujemy w znieczuleniu miejscowym. Jeśli boisz się wizyty, powiedz nam o tym przy zapisie.
    - pytanie:
        pl: Jak mogę zapłacić?
      odpowiedz:
        pl: Gotówką, kartą, BLIK-iem albo w ratach 0%.
    - pytanie:
        pl: Co zrobić, gdy boli ząb?
      odpowiedz:
        pl: Zadzwoń rano. Codziennie zostawiamy wolne terminy dla osób z bólem.
