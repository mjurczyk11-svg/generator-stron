  lista:
    - autor: Marta K.
      tekst:
        pl: Chodziłam w ciąży i po porodzie. Pani Ania wszystko tłumaczy spokojnie i bez oceniania.
    - autor: Ewelina S.
      tekst:
        pl: Po cesarskim cięciu bałam się ćwiczeń. Po kilku wizytach wróciłam do biegania.
    - autor: Iwona D.
      tekst:
        pl: Osteopatia u pani Zofii pomogła mi na bóle głowy, z którymi chodziłam od miesięcy.
faq:
  lista:
    - pytanie:
        pl: Kiedy po porodzie mogę przyjść na wizytę?
      odpowiedz:
        pl: Zwykle 6 tygodni po porodzie naturalnym i 8 tygodni po cesarskim cięciu. Wcześniej możemy pomóc przy bólach pleców i karmieniu.
    - pytanie:
        pl: Czy mogę przyjść z dzieckiem?
      odpowiedz:
        pl: Tak. W pracowni jest miejsce na wózek i mata do przewijania.
    - pytanie:
        pl: Czy potrzebne jest skierowanie?
      odpowiedz:
        pl: Nie, przyjmujemy prywatnie bez skierowania.
    - pytanie:
        pl: Czy w ciąży można chodzić na fizjoterapię?
      odpowiedz:
        pl: Tak, przez całą ciążę, jeśli lekarz prowadzący nie zalecił inaczej.
