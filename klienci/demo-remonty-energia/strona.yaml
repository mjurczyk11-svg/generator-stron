faq:
  lista:
    - pytanie:
        pl: Czy pompa ciepła sprawdzi się w starszym domu?
      odpowiedz:
        pl: Często tak, ale zależy to od ocieplenia i grzejników. Sprawdzamy to na bezpłatnym audycie.
    - pytanie:
        pl: Ile kosztuje fotowoltaika 6 kWp?
      odpowiedz:
        pl: Zwykle od 22 000 do 28 000 zł brutto przed dotacją, zależnie od paneli i falownika.
    - pytanie:
        pl: Kto składa wniosek o dotację?
      odpowiedz:
        pl: Wniosek składasz Ty, ale my go przygotowujemy i kompletujemy dokumenty.
    - pytanie:
        pl: Jak długo czeka się na montaż?
      odpowiedz:
        pl: Zwykle 3–5 tygodni od podpisania umowy.
