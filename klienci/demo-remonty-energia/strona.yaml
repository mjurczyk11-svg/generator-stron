o_nas:
  naglowek:
    pl: Instalujemy tak, jak u siebie w domu
  tekst:
    pl: |
      EkoMoc działa od 2016 roku. Mamy trzy ekipy montażowe, własny serwis i doradców, którzy znają programy dotacyjne od podszewki.

      Pompę ciepła dobieramy na podstawie obliczeń, a nie „na oko”. Dzięki temu urządzenie pracuje oszczędnie i nie przegrzewa domu ani rachunków.
  zdjecie: pv-1.jpg
  zdjecie_opis:
    pl: Monter niesie panel fotowoltaiczny na dachu
  liczby:
    - wartosc: 1 150
      opis:
        pl: instalacji fotowoltaicznych
    - wartosc: '640'
      opis:
        pl: pomp ciepła
    - wartosc: '8'
      opis:
        pl: lat doświadczenia
dofinansowania:
  naglowek:
    pl: Pomożemy uzyskać dofinansowanie
  tekst:
    pl: |
      Na pompę ciepła i fotowoltaikę możesz dostać nawet kilkadziesiąt tysięcy złotych dotacji. Sprawdzamy, z których programów możesz skorzystać, i przygotowujemy wniosek.

      Rozliczenie z programu robimy razem z Tobą po montażu. Do kosztów możesz też doliczyć ulgę termomodernizacyjną.
  punkty:
    - pl: Czyste Powietrze
    - pl: Mój Prąd
    - pl: Moje Ciepło
    - pl: Ulga termomodernizacyjna
