faq:
  lista:
    - pytanie:
        pl: Ile kosztuje wykończenie mieszkania pod klucz?
      odpowiedz:
        pl: Zwykle od 1 400 do 2 200 zł za m² z materiałami, zależnie od standardu. Dokładną cenę podajemy w kosztorysie.
    - pytanie:
        pl: Jak długo trwa wykończenie mieszkania?
      odpowiedz:
        pl: Mieszkanie 50–70 m² wykańczamy zwykle w 8–12 tygodni.
    - pytanie:
        pl: Czy pomagacie w wyborze materiałów?
      odpowiedz:
        pl: Tak. Jeździmy z klientami do hurtowni i doradzamy, co sprawdzi się w praktyce.
    - pytanie:
        pl: Czy wystawiacie fakturę z 8% VAT?
      odpowiedz:
        pl: Tak, w mieszkaniach do 150 m² stosujemy stawkę 8%.
formularz:
  typ: wycena
  dostawca: netlify
