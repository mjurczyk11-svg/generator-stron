opinie:
  ocena: 5
  liczba: 189
  zrodlo: Google
  link: https://www.google.com/maps
  lista:
    - autor: Szymon R.
      tekst:
        pl: Czarne BMW bez jednego hologramu. Dostałem zdjęcia z każdego etapu i instrukcję mycia.
    - autor: Natalia K.
      tekst:
        pl: Wnętrze po psie wygląda jak nowe. Przyjechałam po auto i nie mogłam uwierzyć.
    - autor: Wojciech L.
      tekst:
        pl: Ceramika po roku dalej trzyma, woda spływa jak z kaczki. Wrócę na odświeżenie.
faq:
  lista:
    - pytanie:
        pl: Ile trwa korekta lakieru z ceramiką?
      odpowiedz:
        pl: Zwykle 2–3 dni. Auto zostaje w studiu, bo powłoka musi związać w stałej temperaturze.
    - pytanie:
        pl: Jak dbać o auto po powłoce?
      odpowiedz:
        pl: Myć ręcznie, bez myjni szczotkowych. Instrukcję i zestaw startowy dostajesz przy odbiorze.
    - pytanie:
        pl: Czy mogę zostawić auto na noc?
      odpowiedz:
        pl: Tak, studio jest zamykane, monitorowane i ubezpieczone.
    - pytanie:
        pl: Czy dajecie kartę gwarancyjną?
      odpowiedz:
        pl: Tak, na powłoki ceramiczne i folie PPF.
