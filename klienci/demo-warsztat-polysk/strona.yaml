o_nas:
  naglowek:
    pl: Studio, w którym auto spędza tyle czasu, ile trzeba
  tekst:
    pl: |
      Połysk to zamknięte, ogrzewane studio z trzema stanowiskami i oświetleniem do kontroli lakieru. Pracujemy na jednym aucie naraz, bez pośpiechu.

      Przed każdą korektą mierzymy grubość lakieru. Po pracy dostajesz zdjęcia przed i po oraz instrukcję pielęgnacji.
