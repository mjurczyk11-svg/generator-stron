o_nas:
  naglowek:
    pl: Mały warsztat, w którym znasz mechanika
  tekst:
    pl: |
      Garaż 44 to trzy stanowiska i dwóch mechaników. Zaczynałem w 2014 roku w wynajętym boksie, dziś mamy własną halę przy Fordońskiej.

      Nie robimy nic bez Twojej zgody. Dzwonimy z wyceną, a po naprawie oddajemy stare części albo wysyłamy ich zdjęcia.
  zdjecie: o-nas.jpg
  zdjecie_opis:
    pl: Właściciel warsztatu z dokumentami przy aucie
