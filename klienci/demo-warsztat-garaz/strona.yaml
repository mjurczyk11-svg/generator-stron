opinie:
  ocena: 4.9
  liczba: 251
  zrodlo: Google
  link: https://www.google.com/maps
  lista:
    - autor: Kamil W.
      tekst:
        pl: Dostałem SMS ze zdjęciem zużytych klocków i wyceną. Tak powinien działać każdy warsztat.
    - autor: Beata G.
      tekst:
        pl: Auto odebrane tego samego dnia, cena zgodna z tym, co usłyszałam przez telefon.
    - autor: Mateusz Ż.
      tekst:
        pl: Pan Adrian zamiast wymieniać cały wahacz wymienił samą tuleję. Uczciwie.
faq:
  lista:
    - pytanie:
        pl: Czy muszę się umawiać?
      odpowiedz:
        pl: Najlepiej tak, wtedy auto bierzemy od razu. Drobne sprawy, jak żarówka czy wycieraczki, załatwimy bez zapisu.
    - pytanie:
        pl: Czy mogę przywieźć własne części?
      odpowiedz:
        pl: Tak. Gwarancja obejmuje wtedy tylko robociznę.
    - pytanie:
        pl: Czy wystawiacie fakturę VAT?
      odpowiedz:
        pl: Tak, na firmę albo na osobę prywatną.
    - pytanie:
        pl: Jak mogę zapłacić?
      odpowiedz:
        pl: Gotówką, kartą, BLIK-iem albo przelewem.
formularz:
  typ: warsztat
  dostawca: netlify
