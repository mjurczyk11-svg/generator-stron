opinie:
  ocena: 4.9
  liczba: 187
  zrodlo: Google
  link: https://www.google.com/maps
  lista:
    - autor: Katarzyna M.
      tekst:
        pl: Pierwszy raz nie bałam się u dentysty. Pani doktor wszystko wytłumaczyła i leczenie było bezbolesne.
        en: For the first time I wasn't afraid at the dentist. The doctor explained everything and the treatment was painless.
    - autor: Piotr S.
      tekst:
        pl: Leczenie kanałowe zrobione na jednej wizycie, ząb uratowany. Dokładnie i bez pośpiechu.
        en: Root canal done in one visit and the tooth was saved. Thorough and unhurried.
    - autor: Agnieszka W.
      tekst:
        pl: Chodzimy tu z dziećmi. Bardzo cierpliwe podejście do maluchów.
        en: We come here with our children. Very patient with little ones.
faq:
  lista:
    - pytanie:
        pl: Czy przyjmujecie na NFZ?
        en: Do you accept NFZ patients?
      odpowiedz:
        pl: Tak, mamy umowę z NFZ na leczenie zachowawcze dorosłych i dzieci. Terminy NFZ ustalamy telefonicznie.
        en: Yes, we have an NFZ contract for basic treatment of adults and children. Please call to book an NFZ appointment.
    - pytanie:
        pl: Czy leczycie dzieci?
        en: Do you treat children?
      odpowiedz:
        pl: Tak, przyjmujemy dzieci od 3. roku życia. Pierwsza wizyta jest wizytą adaptacyjną.
        en: Yes, from the age of 3. The first visit is a gentle introduction.
    - pytanie:
        pl: Jak mogę zapłacić?
        en: How can I pay?
      odpowiedz:
        pl: Gotówką, kartą, BLIK-iem lub w ratach 0% przez Medi Raty.
        en: Cash, card, BLIK or 0% instalments via Medi Raty.
    - pytanie:
        pl: Co zrobić, gdy boli mnie ząb?
        en: What if I have toothache?
      odpowiedz:
        pl: Zadzwoń do nas. Codziennie zostawiamy wolne terminy dla pacjentów z bólem.
        en: Call us. We keep emergency slots free every day.
