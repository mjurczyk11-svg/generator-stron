pierwsza_wizyta:
  naglowek:
    pl: Jak wygląda pierwsza wizyta
    en: What happens at your first visit
  kroki:
    - tytul:
        pl: Rozmowa
        en: A conversation
      opis:
        pl: Pytamy o dolegliwości, leki i wcześniejsze leczenie.
        en: We ask about symptoms, medication and past treatment.
    - tytul:
        pl: Przegląd i zdjęcie
        en: Check-up and X-ray
      opis:
        pl: Oglądamy zęby i w razie potrzeby robimy zdjęcie RTG na miejscu.
        en: We examine your teeth and take an X-ray on site if needed.
    - tytul:
        pl: Plan leczenia
        en: Treatment plan
      opis:
        pl: Dostajesz plan na piśmie z kosztami poszczególnych etapów.
        en: You receive a written plan with the cost of each stage.
    - tytul:
        pl: Ustalenie terminów
        en: Scheduling
      opis:
        pl: Umawiamy kolejne wizyty w dogodnych dla Ciebie godzinach.
        en: We book the next visits at times that suit you.
  uwagi:
    pl: 'Zabierz ze sobą: dowód osobisty, listę przyjmowanych leków i ostatnie zdjęcia RTG, jeśli je masz. Pierwsza wizyta trwa około 40 minut.'
    en: 'Please bring: an ID, a list of your medication and any recent X-rays. The first visit takes about 40 minutes.'
