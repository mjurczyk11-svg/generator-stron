o_nas:
  naglowek:
    pl: Gabinet, w którym wszystko jest wyjaśnione
    en: A clinic where everything is explained
  tekst:
    pl: |
      Dentica działa w Radomiu od 2009 roku. Przyjmujemy pacjentów w dwóch gabinetach wyposażonych w mikroskop, radiowizjografię i aparat do zdjęć pantomograficznych.

      Przed leczeniem pokazujemy zdjęcia, tłumaczymy możliwe rozwiązania i podajemy koszty. Decyzja zawsze należy do pacjenta.
    en: |
      Dentica has been working in Radom since 2009. We see patients in two surgeries equipped with a microscope, digital X-ray and a panoramic X-ray unit.

      Before treatment we show you the images, explain the options and give you the costs. The decision is always yours.
  zdjecie: gabinet-1.jpg
