faq:
  - pytanie: Ile kosztuje remont łazienki?
    odpowiedz: Remont łazienki o powierzchni 4–5 m² kosztuje zwykle od 18 000 do 30 000 zł z robocizną, zależnie od zakresu i materiałów. Dokładną cenę podajemy po bezpłatnych oględzinach.
  - pytanie: Jak długo czeka się na termin?
    odpowiedz: Zwykle od 4 do 8 tygodni. Termin rozpoczęcia wpisujemy do umowy.
  - pytanie: Czy kupujecie materiały?
    odpowiedz: Tak, możemy kupić i dowieźć wszystkie materiały. Możesz też wybrać je sam, a my doradzimy.
  - pytanie: Czy trzeba się wyprowadzić na czas remontu?
    odpowiedz: Przy remoncie łazienki nie. Przy remoncie całego mieszkania zwykle tak.

formularz:
  typ: wycena
  dostawca: netlify
