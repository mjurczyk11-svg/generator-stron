      tekst:
        pl: Pan Piotr powiedział, że nasze opony wytrzymają jeszcze sezon. Inny warsztat chciał sprzedać nowe.
faq:
  lista:
    - pytanie:
        pl: Kiedy zmienić opony na zimowe?
      odpowiedz:
        pl: Gdy temperatura rano spada poniżej 7°C. Zwykle w drugiej połowie października.
    - pytanie:
        pl: Ile kosztuje przechowanie opon?
      odpowiedz:
        pl: 120 zł za komplet na sezon. Z felgami 150 zł.
    - pytanie:
        pl: Czy trzeba się umawiać?
      odpowiedz:
        pl: W sezonie lepiej tak. Poza sezonem przyjmujemy też bez zapisu.
    - pytanie:
        pl: Czy wymieniacie opony w autach dostawczych?
      odpowiedz:
        pl: Tak, do 3,5 tony.
formularz:
  typ: warsztat
  dostawca: netlify
