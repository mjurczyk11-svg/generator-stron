o_nas:
  naglowek:
    pl: Od 1996 roku przy Bałtyckiej
  tekst:
    pl: |
      Wulkanizację otworzył nasz tata w garażu przy domu. Dziś mamy trzy stanowiska, przechowalnię opon i komputerową geometrię, ale dalej pracujemy po sąsiedzku.

      Znamy wielu klientów po imieniu i pamiętamy, jakie mają auta. Opony do przechowalni opisujemy i sprawdzamy, czy nadają się na kolejny sezon.
  zdjecie: o-nas.jpg
  zdjecie_opis:
    pl: Mechanik przy maszynie do wymiany opon
