opinie:
  ocena: 4.9
  liczba: 287
  zrodlo: Google
  link: https://www.google.com/maps
  lista:
    - autor: Bartek L.
      tekst:
        pl: Po rekonstrukcji ACL wróciłem do biegania po 8 miesiącach. Plan był jasny od pierwszej wizyty.
    - autor: Ola N.
      tekst:
        pl: Ból szyi męczył mnie od roku. Po kilku wizytach i ćwiczeniach w domu jest dużo lepiej.
    - autor: Grzegorz T.
      tekst:
        pl: Konkretne podejście, pełna godzina terapii, a nie 20 minut na sprzęcie.
faq:
  lista:
    - pytanie:
        pl: Czy potrzebuję skierowania?
      odpowiedz:
        pl: Nie. Przyjmujemy prywatnie, bez skierowania.
    - pytanie:
        pl: Ile wizyt będzie potrzebnych?
      odpowiedz:
        pl: To zależy od problemu. Po pierwszej wizycie powiemy, ile spotkań przewidujemy i jak często.
    - pytanie:
        pl: Co zabrać na wizytę?
      odpowiedz:
        pl: Wygodny strój sportowy i wyniki badań, jeśli je masz.
    - pytanie:
        pl: Czy wystawiacie faktury?
      odpowiedz:
        pl: Tak, na firmę lub na osobę prywatną.
