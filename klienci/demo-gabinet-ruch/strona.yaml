o_nas:
  naglowek:
    pl: Terapia, która ma plan i cel
  tekst:
    pl: |
      FizjoRuch to czterech fizjoterapeutów i sala do treningu medycznego. Pracujemy z osobami po urazach, po operacjach i z tymi, które chcą wrócić do sportu.

      Na pierwszej wizycie badamy, rozmawiamy o celu i ustalamy plan. Dostajesz ćwiczenia do domu, a postępy sprawdzamy na kolejnych spotkaniach.
  zdjecie: o-nas.jpg
