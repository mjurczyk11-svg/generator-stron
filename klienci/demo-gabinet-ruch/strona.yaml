pierwsza_wizyta:
  naglowek:
    pl: Jak wygląda pierwsza wizyta
  kroki:
    - tytul:
        pl: Wywiad
      opis:
        pl: Pytamy o dolegliwości, przebieg urazu i Twój cel.
    - tytul:
        pl: Badanie
      opis:
        pl: Sprawdzamy zakres ruchu, siłę i wzorce ruchowe.
    - tytul:
        pl: Terapia
      opis:
        pl: Już na pierwszej wizycie zaczynamy pracę.
    - tytul:
        pl: Plan i ćwiczenia
      opis:
        pl: Dostajesz plan terapii i zestaw ćwiczeń do domu.
  uwagi:
    pl: Weź wygodny strój i wyniki badań (RTG, rezonans, wypis ze szpitala), jeśli je masz.
