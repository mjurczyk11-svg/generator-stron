  link: https://www.google.com/maps
  lista:
    - autor: Magdalena K.
      tekst:
        pl: Przed licówkami zobaczyłam na ekranie, jak będą wyglądać. Efekt jest dokładnie taki, jak na projekcie.
    - autor: Robert N.
      tekst:
        pl: Spokojna atmosfera, wszystko wyjaśnione i rozpisane. Implant bez komplikacji.
    - autor: Julia P.
      tekst:
        pl: Pani doktor odradziła mi licówki na wszystkie zęby i zaproponowała bonding. Doceniam szczerość.
faq:
  lista:
    - pytanie:
        pl: Czy licówki niszczą zęby?
      odpowiedz:
        pl: Licówki porcelanowe wymagają niewielkiego oszlifowania szkliwa. Przy bondingu zęby zwykle nie są szlifowane. Na konsultacji omawiamy, co będzie lepsze w Twoim przypadku.
    - pytanie:
        pl: Ile trwa wykonanie licówek?
      odpowiedz:
        pl: Zwykle 3 wizyty w ciągu około 3 tygodni.
    - pytanie:
        pl: Czy przyjmujecie na NFZ?
      odpowiedz:
        pl: Nie, gabinet przyjmuje wyłącznie prywatnie.
    - pytanie:
        pl: Czy mogę zapłacić w ratach?
      odpowiedz:
        pl: Tak, współpracujemy z firmą oferującą raty 0% na leczenie stomatologiczne.
