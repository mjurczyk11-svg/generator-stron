o_nas:
  naglowek:
    pl: Kameralny gabinet, jeden lekarz prowadzący
  tekst:
    pl: |
      Perła Dental Studio to dwa gabinety i własna współpraca z krakowską pracownią protetyczną. Leczenie prowadzi jeden lekarz od pierwszej konsultacji do końca.

      Zanim zaczniemy, pokazujemy cyfrową symulację efektu i omawiamy wszystkie możliwości, także te prostsze i tańsze.
