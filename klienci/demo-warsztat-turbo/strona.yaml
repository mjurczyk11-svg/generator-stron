opinie:
  ocena: 4.9
  liczba: 368
  zrodlo: Google
  link: https://www.google.com/maps
  lista:
    - autor: Rafał M.
      tekst:
        pl: Dwa inne warsztaty chciały wymieniać turbinę. Tu znaleźli pękniętego węża intercoolera. Naprawa za 300 zł.
    - autor: Firma TransKur
