o_nas:
  naglowek:
    pl: Warsztat od diesli, nie od wszystkiego
  tekst:
    pl: |
      Turbo Serwis zaczynał w 2009 roku od regeneracji turbin. Dziś mamy cztery stanowiska, w tym kanał dla ciężarówek, i stół probierczy do wtryskiwaczy.

      Każdą turbinę i każdy wtryskiwacz sprawdzamy na urządzeniach, zanim wróci do auta. Dostajesz wydruk z pomiarów i gwarancję na piśmie.
  zdjecie: o-nas.jpg
  zdjecie_opis:
    pl: Mechanik pracuje przy czerwonej ciężarówce w warsztacie
  liczby:
    - wartosc: '15'
      opis:
        pl: lat w Łodzi
    - wartosc: 4 800
      opis:
        pl: zregenerowanych turbin
    - wartosc: '4'
      opis:
        pl: stanowiska, w tym kanał
