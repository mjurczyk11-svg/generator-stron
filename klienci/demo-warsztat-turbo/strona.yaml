faq:
  lista:
    - pytanie:
        pl: Ile kosztuje regeneracja turbiny?
      odpowiedz:
        pl: Zwykle od 1 200 do 2 000 zł z demontażem i montażem. Dokładną cenę podajemy po diagnostyce.
    - pytanie:
        pl: Czy przyjmujecie ciężarówki?
      odpowiedz:
        pl: Tak, auta do 7,5 tony. Mamy kanał i plac manewrowy.
    - pytanie:
        pl: Jak długo trwa naprawa?
      odpowiedz:
        pl: Regenerację turbiny kończymy zwykle w 24 godziny. Wtryskiwacze w 1–2 dni.
    - pytanie:
        pl: Czy dajecie gwarancję?
      odpowiedz:
        pl: Tak, 24 miesiące na regenerowane turbiny i 12 miesięcy na pozostałe naprawy.
