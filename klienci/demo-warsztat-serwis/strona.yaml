opinie:
  ocena: 4.8
  liczba: 594
  zrodlo: Google
  link: https://www.google.com/maps
  lista:
    - autor: Anna S.
      tekst:
        pl: Przegląd na gwarancji o połowę taniej niż w ASO, z wpisem do książki. Auto odebrane spod domu.
    - autor: Piotr K.
      tekst:
        pl: Profesjonalnie jak w salonie. Dostałem SMS, że auto gotowe, i kosztorys zgodny z fakturą.
    - autor: Flota BudMax
      tekst:
        pl: Obsługują nasze 30 aut. Szybkie terminy i jedna faktura na koniec miesiąca.
faq:
  lista:
    - pytanie:
        pl: Czy przegląd u was nie zerwie gwarancji?
      odpowiedz:
        pl: Nie. Prawo UE pozwala serwisować auto na gwarancji w niezależnym serwisie, jeśli przegląd jest zgodny z zaleceniami producenta.
    - pytanie:
        pl: Czy mogę poczekać na auto?
      odpowiedz:
        pl: Przy przeglądzie i wymianie oleju tak. Mamy poczekalnię z kawą i Wi-Fi.
    - pytanie:
        pl: Czy odbieracie auto z domu?
      odpowiedz:
        pl: Tak, na terenie Kielc odbiór i dowóz są bezpłatne przy przeglądzie.
    - pytanie:
        pl: Czy obsługujecie hybrydy?
      odpowiedz:
        pl: Tak. Mamy uprawnienia do pracy przy instalacjach wysokiego napięcia.
formularz:
  typ: warsztat
