o_nas:
  naglowek:
    pl: Standard serwisu autoryzowanego, ceny niezależnego warsztatu
  tekst:
    pl: |
      AutoSerwis Centrum działa od 2005 roku. Mamy osiem stanowisk, testery fabryczne i zespół mechaników, którzy regularnie przechodzą szkolenia producentów części.

      Przeglądy robimy według książki serwisowej, na częściach o jakości oryginalnej. Dzięki temu gwarancja producenta auta pozostaje ważna.
  zdjecie: o-nas.jpg
  zdjecie_opis:
    pl: Kierownik serwisu w kombinezonie roboczym
