        pl: Zawieszenie, hamulce, układ wydechowy, sprzęgło i rozrząd.
      ikona: wrench
    - nazwa:
        pl: Diagnostyka komputerowa
      opis:
        pl: Odczyt błędów i pomiary dla aut osobowych i dostawczych.
      ikona: laptop
    - nazwa:
        pl: Klimatyzacja
      opis:
        pl: Napełnianie, odgrzybianie i naprawa układu klimatyzacji.
      ikona: snowflake
    - nazwa:
