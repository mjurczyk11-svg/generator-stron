  nazwa_prawna: Auto-Serwis Kowalczyk Marek Kowalczyk
  branza:
    pl: Mechanik samochodowy
  typ_schema: AutoRepair
  opis:
    pl: Warsztat samochodowy w Kielcach. Mechanika, diagnostyka komputerowa, klimatyzacja, wymiana opon i przeglądy wszystkich marek.
