opinie:
  ocena: 4.8
  liczba: 312
  link: https://www.google.com/maps
  lista:
    - autor: Tomasz K.
      tekst:
        pl: Uczciwa wycena i szybka naprawa. Pan Marek wszystko pokazał i wytłumaczył.
    - autor: Ewa P.
      tekst:
        pl: Wymiana opon bez czekania, wszystko sprawnie. Polecam.
    - autor: Michał R.
      tekst:
        pl: Inne warsztaty nie mogły znaleźć usterki, tutaj zdiagnozowali ją w godzinę.
faq:
  lista:
    - pytanie:
        pl: Ile trwa wymiana opon?
      odpowiedz:
        pl: Około 30 minut. W sezonie najlepiej umówić termin telefonicznie.
    - pytanie:
        pl: Czy mogę zostawić auto na noc?
      odpowiedz:
        pl: Tak, plac jest monitorowany i zamykany. Kluczyki możesz wrzucić do skrzynki przy wejściu.
    - pytanie:
        pl: Czy wystawiacie fakturę VAT?
      odpowiedz:
        pl: Tak, na każdą naprawę wystawiamy fakturę VAT albo paragon.
    - pytanie:
        pl: Czy mogę przywieźć własne części?
      odpowiedz:
        pl: Tak, ale gwarancja obejmuje wtedy tylko robociznę.
formularz:
  typ: warsztat
  dostawca: netlify
