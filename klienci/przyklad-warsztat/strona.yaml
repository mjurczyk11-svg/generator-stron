    - { autor: Ewa P., tekst: "Wymiana opon bez czekania, wszystko sprawnie. Polecam." }
    - { autor: Michał R., tekst: "Inne warsztaty nie mogły znaleźć usterki, tutaj zdiagnozowali ją w godzinę." }

faq:
  - pytanie: Ile trwa wymiana opon?
    odpowiedz: Około 30 minut. W sezonie najlepiej umówić termin telefonicznie.
  - pytanie: Czy mogę zostawić auto na noc?
    odpowiedz: Tak, plac jest monitorowany i zamykany. Kluczyki możesz wrzucić do skrzynki przy wejściu.
  - pytanie: Czy wystawiacie fakturę VAT?
    odpowiedz: Tak, na każdą naprawę wystawiamy fakturę VAT albo paragon.
  - pytanie: Czy mogę przywieźć własne części?
    odpowiedz: Tak, ale gwarancja obejmuje wtedy tylko robociznę.

formularz:
  typ: warsztat
  dostawca: netlify
