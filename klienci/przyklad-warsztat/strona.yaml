        pl: Wymiana oleju
      opis:
        pl: Olej i filtry dobrane do zaleceń producenta.
      ikona: droplet
    - nazwa:
        pl: Elektryka
      opis:
        pl: Rozruszniki, alternatory, oświetlenie i akumulatory.
      ikona: zap
    - nazwa:
