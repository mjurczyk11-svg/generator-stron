faq:
  lista:
    - pytanie:
        pl: Czy pracujecie bez projektu?
      odpowiedz:
        pl: Przy mniejszych zleceniach tak. Przy większych polecamy współpracujące biura architektoniczne.
    - pytanie:
        pl: Jaki jest czas oczekiwania na rozpoczęcie?
      odpowiedz:
        pl: Zwykle od 6 do 10 tygodni. Termin startu wpisujemy do umowy.
    - pytanie:
        pl: Czy kupujecie materiały?
      odpowiedz:
        pl: Tak, zajmujemy się zakupami, logistyką i odbiorem dostaw.
    - pytanie:
        pl: Jak rozliczacie prace?
      odpowiedz:
        pl: Etapami, po odbiorze każdego etapu przez inwestora.
