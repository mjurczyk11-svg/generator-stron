  link: https://www.google.com/maps
  lista:
    - autor: Iwona K.
      tekst:
        pl: Łazienka zrobiona w dwa tygodnie, tak jak obiecali. Codziennie sprzątali po sobie.
    - autor: Damian R.
      tekst:
        pl: Wycenę dostałem następnego dnia. Cena na fakturze taka sama jak w umowie.
    - autor: Małgorzata S.
      tekst:
        pl: Pan Łukasz doradził tańsze rozwiązanie z płytami gipsowymi. Efekt świetny.
faq:
  lista:
    - pytanie:
        pl: Ile kosztuje remont łazienki?
      odpowiedz:
        pl: Remont łazienki 4–5 m² kosztuje zwykle od 15 000 do 25 000 zł z robocizną. Dokładną cenę podajemy po oględzinach.
    - pytanie:
        pl: Czy robicie małe naprawy?
      odpowiedz:
        pl: Tak, jeśli mamy wolny termin. Przy małych zleceniach liczymy minimum 300 zł.
    - pytanie:
        pl: Czy kupujecie materiały?
      odpowiedz:
        pl: Tak, możemy kupić i przywieźć wszystko. Masz wtedy rabat hurtowy.
    - pytanie:
        pl: Kiedy możecie zacząć?
      odpowiedz:
        pl: Zwykle w ciągu 2–4 tygodni od podpisania umowy.
formularz:
